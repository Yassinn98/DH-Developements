<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DH Developments | Residential Projects in West Cairo</title>
<meta name="description" content="DH Developments – individual homes and residential compounds in West Cairo. Explore Vera and The Villa in New Zayed.">
<meta name="theme-color" content="#0b1d30">
<!-- Fonts: swap or self-host as needed. System fallbacks are defined in --serif / --sans. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@500;600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1. DESIGN TOKENS
   ========================================================= */
:root{
  --navy:#0b1d30; --navy-2:#13304d; --gold:#b9975b; --gold-2:#d9bf8c;
  --sand:#f6f1e7; --sand-2:#ebe2d0; --ink:#1c2531; --muted:#5b6675;
  --line:rgba(11,29,48,.14); --ok:#2e7d57; --err:#b3382c;
  --serif:'Cormorant Garamond','Playfair Display',Georgia,serif;
  --sans:'Inter','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1); --w:1240px; --nav-h:80px;
}
[dir="rtl"]{ --serif:'Noto Naskh Arabic','Cormorant Garamond',serif; --sans:'Cairo','Inter',sans-serif; }

/* =========================================================
   2. RESET & BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:1rem;line-height:1.7;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.12;margin:0 0 .5em;letter-spacing:.005em}
h1{font-size:clamp(2.6rem,6vw,4.8rem)} h2{font-size:clamp(2rem,4.2vw,3.2rem)} h3{font-size:clamp(1.4rem,2.2vw,1.8rem)}
p{margin:0 0 1em}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
.container{width:min(var(--w),100% - 2.5rem);margin-inline:auto}
.section{padding-block:clamp(64px,9vw,120px)}
.bg-sand{background:var(--sand)} .bg-navy{background:var(--navy);color:#fff}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip-link{position:fixed;inset-block-start:-60px;inset-inline-start:12px;z-index:200;background:var(--gold);color:var(--navy);padding:.7rem 1rem;font-weight:600;transition:inset-block-start .2s}
.skip-link:focus{inset-block-start:12px}
.eyebrow{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:1rem}
[dir="rtl"] .eyebrow{letter-spacing:.04em}
.eyebrow.light{color:var(--gold-2)}
.lead{font-size:clamp(1.05rem,1.6vw,1.25rem);font-weight:300;max-width:60ch}
.sec-head{max-width:720px;margin-bottom:clamp(36px,5vw,64px)}
.sec-head.center{text-align:center;margin-inline:auto}
.sec-head.row{max-width:none;display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;flex-wrap:wrap}
.muted{color:var(--muted)}
.arrow{display:inline-block;transition:transform .3s var(--ease)}
[dir="rtl"] .arrow{transform:scaleX(-1)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.95rem 1.8rem;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border:1px solid transparent;border-radius:2px;transition:background .3s,color .3s,border-color .3s,transform .3s var(--ease)}
[dir="rtl"] .btn{letter-spacing:.02em;font-size:.9rem}
.btn:hover{transform:translateY(-2px)}
.btn-gold{background:var(--gold);color:var(--navy)} .btn-gold:hover{background:var(--gold-2)}
.btn-ghost{border-color:rgba(255,255,255,.6);color:#fff} .btn-ghost:hover{background:#fff;color:var(--navy)}
.btn-dark{background:var(--navy);color:#fff} .btn-dark:hover{background:var(--navy-2)}
.btn-outline{border-color:var(--navy);color:var(--navy)} .btn-outline:hover{background:var(--navy);color:#fff}
.btn-wa{background:#1fa855;color:#fff} .btn-wa:hover{background:#17924a}
.btn-block{width:100%}
.btn:hover .arrow{transform:translateX(4px)} [dir="rtl"] .btn:hover .arrow{transform:scaleX(-1) translateX(4px)}

/* =========================================================
   3. IMAGES + PLACEHOLDERS
   Real images use <img class="pic">. Anything without an image
   yet falls back to a clearly labelled placeholder box (.ph).
   ========================================================= */
.pic{display:block;width:100%;object-fit:cover;background:var(--sand-2);transition:transform .9s var(--ease)}
.pic-fill{position:absolute;inset:0;height:100%;aspect-ratio:auto}
.ph{position:relative;width:100%;display:grid;place-items:center;overflow:hidden;color:#fff;transition:transform .9s var(--ease)}
.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 14px,transparent 14px 28px)}
.ph::after{content:"";position:absolute;inset:10px;border:1px dashed rgba(255,255,255,.35);pointer-events:none}
.ph-fill{position:absolute;inset:0;height:100%;aspect-ratio:auto}
.ph-label{position:relative;text-align:center;padding:1rem 1.6rem;max-width:90%;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.ph-label b{display:block;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.ph-label i{display:block;font-style:normal;font-size:.72rem;opacity:.85;margin-top:.15rem}
.ph-label em{display:block;font-style:normal;font-size:.8rem;opacity:.92;margin-top:.45rem;line-height:1.4}
.ph-fill .ph-label{position:absolute;inset-block-end:14px;inset-inline-end:14px;text-align:end;max-width:min(360px,60%);background:rgba(0,0,0,.28);padding:.6rem .9rem}
.tone-1{background:linear-gradient(135deg,#1f4468,#0b1d30)} .tone-2{background:linear-gradient(135deg,#2d5a4e,#10302a)}
.tone-3{background:linear-gradient(135deg,#8a7a5c,#4a3f2b)} .tone-4{background:linear-gradient(135deg,#3f6a8a,#17324a)}
.tone-5{background:linear-gradient(135deg,#b49a6e,#6f5a36)} .tone-6{background:linear-gradient(135deg,#55606e,#262e39)}
.zoom{overflow:hidden} .zoom:hover .ph,.zoom:hover .pic{transform:scale(1.06)}

/* =========================================================
   4. NAVBAR (sticky, transparent -> solid)
   ========================================================= */
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:100;color:#fff;transition:background .35s,box-shadow .35s,height .35s}
.nav.solid{background:rgba(11,29,48,.96);backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.18);height:68px}
.nav-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:1.5rem}
.brand{display:flex;align-items:center;gap:.85rem}
.brand img{height:42px;width:auto;object-fit:contain;transition:height .35s}
.nav.solid .brand img{height:36px}
.brand-name{font-family:var(--serif);font-size:1.35rem;letter-spacing:.16em;font-weight:700;white-space:nowrap}
[dir="rtl"] .brand-name{letter-spacing:0}
.nav-links{display:flex;align-items:center;gap:2rem}
.nav-links a.link{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;position:relative;padding-block:.4rem}
[dir="rtl"] .nav-links a.link{letter-spacing:0;font-size:.95rem}
.nav-links a.link::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--gold-2);transform:scaleX(0);transition:transform .35s var(--ease)}
.nav-links a.link:hover::after,.nav-links a.link[aria-current="page"]::after{transform:scaleX(1)}
.nav-tools{display:flex;align-items:center;gap:1rem}
.lang-btn{border:1px solid rgba(255,255,255,.5);padding:.4rem .85rem;font-size:.78rem;border-radius:2px;transition:background .3s,color .3s}
.lang-btn:hover{background:#fff;color:var(--navy)}
.nav .btn{padding:.7rem 1.2rem}
.burger{display:none;width:44px;height:44px;place-items:center}
.burger span,.burger span::before,.burger span::after{display:block;width:24px;height:2px;background:#fff;position:relative;transition:transform .3s,background .3s}
.burger span::before,.burger span::after{content:"";position:absolute;inset-inline-start:0}
.burger span::before{top:-7px} .burger span::after{top:7px}
.burger[aria-expanded="true"] span{background:transparent}
.burger[aria-expanded="true"] span::before{transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded="true"] span::after{transform:translateY(-7px) rotate(-45deg)}
@media (max-width:960px){
  .burger{display:grid}
  .nav .btn{display:none}
  .brand-name{font-size:1.1rem}
  .nav-links{position:fixed;inset:0 0 0 0;background:var(--navy);flex-direction:column;justify-content:center;gap:1.6rem;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;z-index:-1}
  .nav-links.open{opacity:1;visibility:visible}
  .nav-links a.link{font-size:1.1rem}
  .nav.menu-open{background:var(--navy)}
}
@media (max-width:420px){.brand-name{display:none}}

/* =========================================================
   5. HERO & PAGE BANNERS
   ========================================================= */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;color:#fff;overflow:hidden;background:var(--navy)}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,29,48,.6) 0%,rgba(11,29,48,.3) 40%,rgba(11,29,48,.85) 100%)}
.hero-inner{position:relative;padding-block:calc(var(--nav-h) + 40px) 90px}
.hero h1{max-width:16ch;margin-bottom:.4em}
.hero .lead{margin-bottom:2.4rem}
.hero-cta{display:flex;gap:1rem;flex-wrap:wrap}
.page-hero{position:relative;padding:calc(var(--nav-h) + 80px) 0 80px;color:#fff;overflow:hidden;isolation:isolate;background:var(--navy)}
.page-hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,29,48,.5),rgba(11,29,48,.85))}
.page-hero .container{position:relative}
.page-hero h1{font-size:clamp(2.4rem,5.4vw,4.2rem);margin-bottom:.3em}
.crumbs{font-size:.8rem;opacity:.85;margin-bottom:1.2rem}
.crumbs a:hover{color:var(--gold-2)}

/* =========================================================
   6. CARDS, CAROUSEL, GRID
   ========================================================= */
.card{background:#fff;box-shadow:0 10px 34px rgba(11,29,48,.08);transition:transform .45s var(--ease),box-shadow .45s}
.card:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(11,29,48,.16)}
.card-link{display:block;height:100%}
.card-media{position:relative;overflow:hidden}
.card-body{padding:1.5rem 1.6rem 1.8rem}
.card-body h3{margin-bottom:.3em}
.card-body p{color:var(--muted);font-size:.95rem}
.more{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--navy)}
[dir="rtl"] .more{letter-spacing:0;font-size:.9rem}
.card:hover .more .arrow{transform:translateX(5px)} [dir="rtl"] .card:hover .more .arrow{transform:scaleX(-1) translateX(5px)}
.badge{position:absolute;inset-block-start:14px;inset-inline-start:14px;z-index:2;padding:.35rem .8rem;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#fff;border-radius:2px}
[dir="rtl"] .badge{letter-spacing:0;font-size:.8rem}
.badge.ready{background:var(--ok)} .badge.construction{background:#b8741c} .badge.launching{background:var(--navy);border:1px solid var(--gold)}
.badge.inline{position:static;display:inline-block}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:28px}

.carousel{position:relative}
.track{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 30px;scrollbar-width:none;scroll-behavior:smooth}
.track::-webkit-scrollbar{display:none}
.track>*{flex:1 0 min(86%,410px);scroll-snap-align:start}
.car-ctrl{display:flex;gap:.7rem}
.car-btn{width:50px;height:50px;border:1px solid var(--navy);display:grid;place-items:center;transition:background .3s,color .3s}
.car-btn:hover{background:var(--navy);color:#fff}
.car-btn svg{width:20px;height:20px} [dir="rtl"] .car-btn svg{transform:scaleX(-1)}

/* =========================================================
   7. HOME: RANGE, STATS, LIFESTYLE, NEWS, CTA
   ========================================================= */
.range{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.range figure{margin:0}
.range .zoom{display:block}
.range figcaption{padding-top:1rem}
.range h3{font-size:1.5rem;margin-bottom:.2em} .range p{color:var(--muted);font-size:.95rem;margin:0}
@media (max-width:860px){.range{grid-template-columns:1fr}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;text-align:center}
.stat{padding:1rem;border-inline-start:1px solid rgba(255,255,255,.15)} .stat:first-child{border-inline-start:0}
.stat .num{font-family:var(--serif);font-size:clamp(2.6rem,5vw,4.2rem);color:var(--gold-2);font-weight:600;line-height:1}
.stat p{margin:.6rem 0 0;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
[dir="rtl"] .stat p{letter-spacing:0;font-size:.95rem}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-inline-start:0}}

.life{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.life-tile{position:relative;color:#fff;overflow:hidden;min-height:520px;display:flex;align-items:flex-end;background:var(--navy)}
.life-tile .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(11,29,48,.9))}
.life-tile .txt{position:relative;padding:2rem;z-index:1;max-width:46ch}
.life-tile .ico{color:var(--gold-2);margin-bottom:.8rem}
.life-tile h3{font-size:1.8rem;margin-bottom:.3em} .life-tile p{font-size:.98rem;opacity:.92;margin:0}
.life-tile .ph-label{inset-block-start:14px;inset-block-end:auto;inset-inline-end:14px}
@media (max-width:860px){.life{grid-template-columns:1fr}.life-tile{min-height:420px}}

.news-meta{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.5rem}
.cta{position:relative;color:#fff;text-align:center;overflow:hidden;isolation:isolate;background:var(--navy)}
.cta .shade{position:absolute;inset:0;background:rgba(11,29,48,.78)}
.cta .container{position:relative;padding-block:clamp(70px,10vw,130px)}
.cta .btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}

/* =========================================================
   8. PROJECTS PAGE (filters)
   ========================================================= */
.filters{display:grid;gap:1.4rem;margin-bottom:2.6rem;padding:1.6rem;background:var(--sand)}
.filter-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.filter-row>strong{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;min-width:100px;color:var(--muted)}
[dir="rtl"] .filter-row>strong{letter-spacing:0;font-size:.85rem}
.chip{padding:.5rem 1.1rem;border:1px solid var(--line);background:#fff;font-size:.88rem;border-radius:100px;transition:all .25s}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.result-count{color:var(--muted);margin-bottom:1.4rem;font-size:.92rem}
.empty{text-align:center;padding:4rem 1rem;color:var(--muted);grid-column:1/-1}

/* =========================================================
   9. PROJECT DETAIL
   ========================================================= */
.facts{display:flex;flex-wrap:wrap;gap:1rem 2.6rem;margin-top:1.6rem}
.facts div span{display:block;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
[dir="rtl"] .facts div span{letter-spacing:0;font-size:.82rem}
.facts div strong{font-family:var(--serif);font-size:1.4rem;font-weight:600}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:clamp(320px,52vw,560px)}
.gallery button{position:relative;overflow:hidden;display:block;width:100%;height:100%}
.gallery button:first-child{grid-row:1/3}
.gallery .ph,.gallery .pic{height:100%;aspect-ratio:auto!important}
.gallery .more-tag{position:absolute;inset:auto 12px 12px auto;z-index:3;background:var(--navy);color:#fff;font-size:.75rem;padding:.4rem .8rem}
.gal-note{font-size:.82rem;color:var(--muted);margin-top:.9rem}
@media (max-width:760px){.gallery{grid-template-columns:1fr 1fr;grid-template-rows:auto;height:auto}.gallery button:first-child{grid-column:1/-1;grid-row:auto;aspect-ratio:16/10}.gallery button{aspect-ratio:4/3}}
.detail-grid{display:grid;grid-template-columns:1.65fr 1fr;gap:clamp(30px,5vw,70px);align-items:start}
@media (max-width:980px){.detail-grid{grid-template-columns:1fr}}
.aside-card{position:sticky;top:90px;background:var(--sand);padding:2rem;border-top:3px solid var(--gold)}
@media (max-width:980px){.aside-card{position:static}}
.units{width:100%;border-collapse:collapse;margin-bottom:2rem}
.units th,.units td{text-align:start;padding:1rem .8rem;border-bottom:1px solid var(--line)}
.units th{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
[dir="rtl"] .units th{letter-spacing:0;font-size:.85rem}
.units td:first-child{font-family:var(--serif);font-size:1.25rem;font-weight:600}
.amen{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.amen li{display:flex;flex-direction:column;align-items:center;gap:.7rem;padding:1.4rem .8rem;border:1px solid var(--line);text-align:center;font-size:.9rem;transition:border-color .3s,transform .3s var(--ease)}
.amen li:hover{border-color:var(--gold);transform:translateY(-3px)}
.amen .ico{color:var(--gold)}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.pay div{background:var(--navy);color:#fff;padding:1.6rem 1.2rem;text-align:center}
.pay strong{display:block;font-family:var(--serif);font-size:2.2rem;color:var(--gold-2);line-height:1.1}
.pay span{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
[dir="rtl"] .pay span{letter-spacing:0;font-size:.9rem}
.pay-note{background:var(--sand);border-inline-start:3px solid var(--gold);padding:1.8rem}
.pay-note h3{font-size:1.5rem;margin-bottom:.3em}
.block{margin-bottom:clamp(40px,6vw,70px)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.pair{grid-template-columns:1fr}}
.pair figure{margin:0} .pair figcaption{font-size:.82rem;color:var(--muted);padding-top:.5rem}
.pair .btn-img{display:block;width:100%;cursor:zoom-in}
.stack{display:grid;gap:16px}
.tags{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}
.tags li{padding:.5rem 1rem;background:var(--sand);border-inline-start:3px solid var(--gold);font-size:.9rem}
.pn{display:flex;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);padding-top:2rem;margin-top:3rem;flex-wrap:wrap}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:300;background:rgba(5,12,20,.95);display:none;grid-template-rows:auto minmax(0,1fr) auto;color:#fff}
.lightbox.open{display:grid}
.lb-top,.lb-bot{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.4rem;gap:1rem}
.lb-stage{position:relative;display:grid;place-items:center;padding:0 4.5rem;min-height:0}
#lbImg{display:grid;place-items:center;max-width:100%;max-height:100%;min-height:0;width:100%}
#lbImg img{max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto;object-fit:contain;margin-inline:auto}
#lbImg .ph{width:min(1100px,100%);aspect-ratio:16/10}
.lb-btn{width:48px;height:48px;border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;transition:background .3s,color .3s}
.lb-btn:hover{background:#fff;color:var(--navy)}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%)}
.lb-prev{inset-inline-start:.8rem}.lb-next{inset-inline-end:.8rem}
[dir="rtl"] .lb-prev svg,[dir="rtl"] .lb-next svg{transform:scaleX(-1)}
@media (max-width:600px){.lb-stage{padding:0 .6rem}.lb-prev,.lb-next{top:auto;bottom:-64px;transform:none}}

/* =========================================================
   10. ABOUT
   ========================================================= */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,90px);align-items:center}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.vm{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.vm div{background:#fff;padding:2.2rem;border-top:3px solid var(--gold);box-shadow:0 10px 30px rgba(11,29,48,.07)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:26px}
.member h3{font-size:1.35rem;margin:1rem 0 .1em} .member p{color:var(--muted);font-size:.9rem;margin:0}

/* =========================================================
   11. FORMS
   ========================================================= */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.2rem}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}

#app{transition:opacity .4s var(--ease),transform .4s var(--ease);outline:none}

/* Labelled placeholder box (used wherever an image is still missing) */
function ph(label, w, h, desc, o = {}) {
  const cls = o.fill ? 'ph ph-fill' : 'ph';
  const style = o.fill ? '' : `aspect-ratio:${w}/${h};`;
  return `<div class="${cls} tone-${o.tone || 1}" role="img" aria-label="Placeholder ${label}, ${w} by ${h}: ${esc(desc)}" style="${style}"><span class="ph-label"><b>${label}</b><i>${w}×${h}</i><em>${esc(desc)}</em></span></div>`;
}
/* Picture: real image if the key exists in IMG, otherwise the placeholder */
function pic(key, w, h, desc, o = {}) {
  const src = imgSrc(key);
  if (!src) return ph(o.label || 'IMAGE', w, h, desc, o);
  const cls = o.fill ? 'pic pic-fill' : 'pic';
  /* natural:true = never crop (plans, maps): use the image's own proportions and object-fit:contain */
  const dim = o.natural && window.IMGDIM && window.IMGDIM[key];
  const style = (o.fill ? '' : `aspect-ratio:${dim ? dim[0] + '/' + dim[1] : w + '/' + h};`) + (o.natural ? 'object-fit:contain;' : '') + (o.pos ? `object-position:${o.pos};` : '');
  return `<img class="${cls}" src="${src}" alt="${esc(desc)}" loading="${o.eager ? 'eager' : 'lazy'}" decoding="async" style="${style}">`;
}

function field(o) {
  const { id, label, type = 'text', v = 'required', ac = '', full = false } = o;
  const req = v.includes('required');
  return `<div class="field${full ? ' full' : ''}">
    <label for="${id}">${label}${req ? ' <span aria-hidden="true">*</span>' : ''}</label>
    <input id="${id}" name="${id}" type="${type}" autocomplete="${ac}" data-v="${v}" ${req ? 'aria-required="true"' : ''} aria-describedby="${id}-err">
    <p class="err" id="${id}-err" aria-live="polite"></p></div>`;
}
function selectField(id, label, opts, full = false, req = true) {
  return `<div class="field${full ? ' full' : ''}">
    <label for="${id}">${label}${req ? ' <span aria-hidden="true">*</span>' : ''}</label>
    <select id="${id}" name="${id}" ${req ? 'data-v="required" aria-required="true"' : ''} aria-describedby="${id}-err">
      <option value="">${t('opt_choose')}</option>${opts.map(o => `<option>${o}</option>`).join('')}</select>
    <p class="err" id="${id}-err" aria-live="polite"></p></div>`;
}
function validateEl(el) {
  const rules = (el.dataset.v || '').split(' ').filter(Boolean), val = el.value.trim();
  if (rules.includes('required') && !val) return t('v_required');
  if (val && rules.includes('email') && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val)) return t('v_email');
  if (val && rules.includes('phone') && !/^\+?[0-9\s\-()]{8,16}$/.test(val)) return t('v_phone');
  return '';
}
function setErr(el, msg, errEl) {
  errEl = errEl || $('#' + el.id + '-err');
  if (errEl) errEl.textContent = msg;
  el.setAttribute('aria-invalid', msg ? 'true' : 'false');
}
function bindForm(form, o = {}) {
  if (!form) return;
  const els = $$('[data-v]', form);
  els.forEach(el => {
    el.addEventListener('blur', () => { if (el.value || el.getAttribute('aria-invalid') === 'true') setErr(el, validateEl(el), o.errEl); });
    el.addEventListener('input', () => { if (el.getAttribute('aria-invalid') === 'true') setErr(el, validateEl(el), o.errEl); });
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    let first = null;
    els.forEach(el => { const m = validateEl(el); setErr(el, m, o.errEl); if (m && !first) first = el; });
    if (first) { first.focus(); return; }
    /* TODO: send the form data to your backend / email service here (fetch POST) */
    if (o.inline) { form.reset(); o.noteEl.textContent = o.msg; return; }
    const box = document.createElement('div');
    box.className = 'success'; box.setAttribute('role', 'status'); box.tabIndex = -1;
    box.innerHTML = `${icon('check', 48)}<h3>${t('ok_title')}</h3><p>${o.msg || t('ok_text')}</p>`;
    form.replaceWith(box); box.focus();
  });
}

function bindHome() {
  const track = $('#track'), ctrl = $('#carCtrl');

  const dir = () => (document.documentElement.dir === 'rtl' ? -1 : 1);
  $('#carPrev').addEventListener('click', () => track.scrollBy({ left: -step() * dir(), behavior: 'smooth' }));
  $('#carNext').addEventListener('click', () => track.scrollBy({ left: step() * dir(), behavior: 'smooth' }));

  const sync = () => { if (track.isConnected) ctrl.hidden = !(track.scrollWidth > track.clientWidth + 8); };

}

/* =========================================================
   G. LIGHTBOX  (items = [{img, cap, photo?}])
   ========================================================= */
const lb = $('#lightbox'); let lbItems = [], lbIdx = 0, lbTrigger = null;
function paintLb() {
  const it = lbItems[lbIdx];
  $('#lbImg').innerHTML = pic(it.img, 1600, 1000, it.cap, { label: 'GALLERY IMAGE', tone: toneOf(lbIdx + 1), eager: true });
  $('#lbCap').textContent = it.cap; $('#lbCount').textContent = `${lbIdx + 1} / ${lbItems.length}`;
}
function openLightbox(items, i, trigger) {
  lbItems = items; lbIdx = i; lbTrigger = trigger; paintLb(); lb.hidden = false; lb.classList.add('open');
  document.body.style.overflow = 'hidden'; $('#lbClose').focus();
}
function closeLightbox() { lb.classList.remove('open'); lb.hidden = true; document.body.style.overflow = ''; if (lbTrigger && lbTrigger.isConnected) lbTrigger.focus(); }
const stepLb = d => { lbIdx = (lbIdx + d + lbItems.length) % lbItems.length; paintLb(); };
$('#lbClose').addEventListener('click', closeLightbox);
$('#lbPrev').addEventListener('click', () => stepLb(-1));
$('#lbNext').addEventListener('click', () => stepLb(1));
lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('lb-stage') || e.target.id === 'lbImg') closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  const rtl = document.documentElement.dir === 'rtl';
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') stepLb(rtl ? -1 : 1);
  if (e.key === 'ArrowLeft') stepLb(rtl ? 1 : -1);
  if (e.key === 'Tab') { /* simple focus trap across the three buttons */
    const f = [$('#lbClose'), $('#lbPrev'), $('#lbNext')], i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
});

/* =========================================================
   H. SCROLL EFFECTS: reveal, counters, navbar
   ========================================================= */
let io, counterIO;
function initScrollFx() {
  if (io) io.disconnect(); if (counterIO) counterIO.disconnect();
  const items = $$('.reveal:not(.in)'), nums = $$('[data-count]');
  const fmt = (n, s) => n.toLocaleString('en-US') + s;
  if (!('IntersectionObserver' in window) || reduceMotion) {
    items.forEach(x => x.classList.add('in')); nums.forEach(n => n.textContent = fmt(+n.dataset.count, n.dataset.suffix)); return;
  }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12, rootMargin: '0px 0px -40px 0px' });
  items.forEach(x => io.observe(x));
  counterIO = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; counterIO.unobserve(e.target);
    const el = e.target, end = +el.dataset.count, s = el.dataset.suffix, dur = 1800, t0 = performance.now();
    (function tick(now) { const k = Math.min((now - t0) / dur, 1), eased = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(end * eased), k === 1 ? s : ''); if (k < 1) requestAnimationFrame(tick); })(t0);
  }), { threshold: .5 });
  nums.forEach(n => counterIO.observe(n));
}
function onScroll() { navEl.classList.toggle('solid', window.scrollY > 40); }
window.addEventListener('scroll', onScroll, { passive: true });

/* =========================================================
   I. ROUTER (hash-based, with page transitions)
   ========================================================= */
const ROUTES = {
  home:     { title: () => t('nav_home'),     view: viewHome,     bind: bindHome },
  projects: { title: () => t('nav_projects'), view: viewProjects, bind: bindProjects },
  project:  { title: ctx => { const p = PROJECTS.find(x => x.slug === ctx.param); return p ? pName(p) : t('nf_title'); }, view: viewProject, bind: ctx => { if (PROJECTS.some(x => x.slug === ctx.param)) bindProject(); } },
  about:    { title: () => t('nav_about'),    view: viewAbout },
  contact:  { title: () => t('nav_contact'),  view: viewContact,  bind: () => bindForm($('#contactForm')) }
};
function parseHash() {
  const raw = location.hash.slice(1) || '/home', [path, qs] = raw.split('?'), parts = path.split('/').filter(Boolean);
  return { name: parts[0] || 'home', param: parts[1], query: Object.fromEntries(new URLSearchParams(qs || '')) };
}
let navTimer;
function navigate(instant) {
  clearTimeout(navTimer);
  const ctx = parseHash(), r = ROUTES[ctx.name] || { title: () => t('nf_title'), view: viewNotFound };
  const render = () => {
    app.innerHTML = r.view(ctx);
    window.scrollTo(0, 0);
    if (r.bind) r.bind(ctx);
    document.title = `${r.title(ctx)} | ${lang === 'ar' ? SITE.nameAr : SITE.name}`;
    $$('.nav-links a.link').forEach(a => a.removeAttribute('aria-current'));
    const active = $(`.nav-links a[data-r="${ctx.name === 'project' ? 'projects' : ctx.name}"]`);
    if (active) active.setAttribute('aria-current', 'page');
    setMenu(false); onScroll(); initScrollFx();
    app.focus({ preventScroll: true });
  };
  if (instant || reduceMotion) { render(); return; }
  app.classList.add('leaving');
  navTimer = setTimeout(() => {
    render(); app.classList.remove('leaving'); app.classList.add('entering');
    requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('entering')));
  }, 280);
}
window.addEventListener('hashchange', () => navigate(false));
